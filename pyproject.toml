[project]
name = "gopay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "grpcio>=1.85.3",
    "grpcio-tools>=1.85.3",
    "httpx>=0.28.1",
    "segno>=1.6.6",
    "strawberry-graphql>=0.341.2",
    "tenacity>=9.2.1",
]



[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-grpcio>=1.85.0.20261122",
]

[tool.ruff]
line-length = 120
extend-exclude = ["src/gopay/fraude/fraud_pb2*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["gopay.fraude.fraud_pb2", "gopay.fraude.fraud_pb2_grpc"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["gopay.fraude.serveur", "gopay.fraude.client"]
disallow_untyped_calls = false  # le code généré par grpc_tools n'est pas annoté

[tool.pytest.ini_options]
pythonpath = ["."]

